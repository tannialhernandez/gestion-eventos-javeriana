# =============================================================================
# application-test.yml — perfil para tests de integración con Testcontainers
#
# Las coordenadas reales de BD, RabbitMQ y Redis las inyecta @DynamicPropertySource
# en tiempo de ejecucion (URLs de Testcontainers no son conocidas en build time).
# Este archivo solo fija propiedades que SI se conocen de antemano.
# =============================================================================

spring:
  jpa:
    show-sql: true

  flyway:
    enabled: true

  rabbitmq:
    virtual-host: /

jwt:
  public-key: 

outbox:
  relay:
    interval-ms: 500

logging:
  level:
    com.javeriana.eventos: WARN

retention:
  enabled: false
  cron: "0 0 3 * * *"
  outbox-enviado-days: 30
  outbox-fallido-days: 90
  mensaje-procesado-days: 30
  batch-size: 1000
  max-batches-per-run: 100
