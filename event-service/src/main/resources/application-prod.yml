# =============================================================================
# application-prod.yml — producción (AWS ECS)
# Credenciales vía AWS Secrets Manager. NUNCA hardcodear aquí.
# =============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

logging:
  level:
    root: INFO
    com.javeriana.eventos: INFO

# Clave pública RSA-2048 — inyectada por AWS Secrets Manager
jwt:
  public-key: ${JWT_PUBLIC_KEY}

retention:
  enabled: ${RETENTION_ENABLED:true}
  cron: "${RETENTION_CRON:0 0 3 * * *}"
  outbox-enviado-days: ${RETENTION_OUTBOX_ENVIADO_DAYS:30}
  outbox-fallido-days: ${RETENTION_OUTBOX_FALLIDO_DAYS:90}
  mensaje-procesado-days: ${RETENTION_MENSAJE_PROCESADO_DAYS:30}
  batch-size: ${RETENTION_BATCH_SIZE:1000}
  max-batches-per-run: ${RETENTION_MAX_BATCHES_PER_RUN:100}
