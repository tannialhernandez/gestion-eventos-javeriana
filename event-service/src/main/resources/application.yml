spring:
  application:
    name: event-service

  datasource:
    url: jdbc:postgresql://localhost:5432/eventos_event
    username: ${POSTGRES_USER:eventos_user}
    password: ${POSTGRES_PASSWORD:eventos_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Usa Flyway o scripts SQL; nunca auto-create en producción
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.javeriana.eventos: DEBUG
    org.springframework.data.redis: INFO
