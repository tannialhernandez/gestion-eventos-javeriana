# =============================================================================
# application.yml — configuración común a todos los perfiles de event-service
# =============================================================================

spring:
  application:
    name: event-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Publisher Confirms + Returns (ADR-011)
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true

# Outbox Relay scheduler
outbox:
  relay:
    interval-ms: 5000

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.javeriana.eventos: DEBUG
    org.springframework.data.redis: INFO

retention:
  enabled: true
  cron: "0 0 3 * * *"
  outbox-enviado-days: 30
  outbox-fallido-days: 90
  mensaje-procesado-days: 30
  batch-size: 1000
  max-batches-per-run: 100
