spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5432/eventos_payment
    username: ${POSTGRES_USER:eventos_user}
    password: ${POSTGRES_PASSWORD:eventos_pass}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:eventos_user}
    password: ${RABBITMQ_PASSWORD:eventos_pass}
    virtual-host: eventos

server:
  port: 8084

payment:
  gateway:
    provider: ${PAYMENT_GATEWAY_PROVIDER:simulador}
  expiration:
    # RN-10 (SRS §9.3.3, srs-seccion9-modelo-datos-seccion10-trazabilidad.md):
    # "fecha_expiracion_pago = fecha_inscripcion + 15 minutos"
    window-seconds: 900
    # Margen de 60s para tolerar la latencia entre el job de expiración de
    # inscription-service (corre cada 60s) y la llegada del webhook a payment-service.
    # Race condition documentada en docs/follow-ups/payment-refund-async.md.
    grace-period-seconds: 60

resilience4j:
  circuitbreaker:
    instances:
      pasarela-pago:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-calls-in-half-open-state: 3
        record-exceptions:
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
  timelimiter:
    instances:
      pasarela-pago:
        timeout-duration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
