<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 750; }
    .subtitle { font-size: 14px; fill: #5b667a; }
    .label { font-size: 13px; fill: #172033; }
    .small { font-size: 12px; fill: #5b667a; }
    .value { font-size: 13px; font-weight: 700; }
  </style>
<text x="48" y="56" class="title">Tasas de cumplimiento</text>
<text x="48" y="84" class="subtitle">Metricas de error, Retry-After y cache hit rate reportadas por K6.</text>
<text x="262" y="158" text-anchor="end" class="label">Load error rate</text>
<rect x="280" y="130" width="650" height="36" rx="5" fill="#f8fafc" stroke="#d8dee9"/>
<rect x="280" y="130" width="0.0" height="36" rx="5" fill="#15803d"/>
<text x="292.0" y="154" class="value">0.00%</text>
<text x="280" y="184" class="small">Threshold: &lt; 2%</text>
<text x="262" y="228" text-anchor="end" class="label">Circuit Retry-After</text>
<rect x="280" y="200" width="650" height="36" rx="5" fill="#f8fafc" stroke="#d8dee9"/>
<rect x="280" y="200" width="650.0" height="36" rx="5" fill="#14b8a6"/>
<text x="942.0" y="224" class="value">100.00%</text>
<text x="280" y="254" class="small">Threshold: &gt; 90%</text>
<text x="262" y="298" text-anchor="end" class="label">Cache hit rate</text>
<rect x="280" y="270" width="650" height="36" rx="5" fill="#f8fafc" stroke="#d8dee9"/>
<rect x="280" y="270" width="646.8" height="36" rx="5" fill="#2563eb"/>
<text x="938.8" y="294" class="value">99.50%</text>
<text x="280" y="324" class="small">Threshold: &gt; 95%</text>
<text x="262" y="368" text-anchor="end" class="label">RNF-16 checks</text>
<rect x="280" y="340" width="650" height="36" rx="5" fill="#f8fafc" stroke="#d8dee9"/>
<rect x="280" y="340" width="650.0" height="36" rx="5" fill="#f59e0b"/>
<text x="942.0" y="364" class="value">100.00%</text>
<text x="280" y="394" class="small">Threshold: 100%</text>
</svg>
