name: CI E2E Smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAVEN_OPTS: -Djdk.attach.allowAttachSelf=true
      JAVA_TOOL_OPTIONS: -Djdk.attach.allowAttachSelf=true -XX:+EnableDynamicAgentLoading
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Package backend services
        run: |
          mvn -U -N -B install
          mvn -U -f shared/pom.xml -B install -DskipTests
          mvn -U -f event-service/pom.xml -B package -DskipTests -Dmaven.test.skip=true
          mvn -U -f inscription-service/pom.xml -B package -DskipTests -Dmaven.test.skip=true
          mvn -U -f payment-service/pom.xml -B package -DskipTests -Dmaven.test.skip=true
          mvn -U -f auth-service-stub/pom.xml -B package -DskipTests -Dmaven.test.skip=true

      - name: Compile E2E test harness
        run: mvn -U -f e2e-tests/pom.xml -B test

      - name: Start docker-compose E2E stack
        run: |
          set +e
          docker compose -f docker-compose.e2e.yml up -d --build 2>&1 | tee docker-compose-up.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            docker compose -f docker-compose.e2e.yml ps > docker-compose-ps.log || true
            docker compose -f docker-compose.e2e.yml logs --no-color --tail=120 auth-service-stub event-service payment-service inscription-service > docker-compose-services.log || true
            docker compose -f docker-compose.e2e.yml logs --no-color --tail=160 > docker-compose-e2e.log || true
            ruby -e 'parts = []; parts << "=== docker compose ps ===\n#{File.read("docker-compose-ps.log")}" if File.exist?("docker-compose-ps.log"); parts << "=== service logs ===\n#{File.read("docker-compose-services.log")}" if File.exist?("docker-compose-services.log"); msg = parts.join("\n").gsub("%", "%25").gsub("\r", "%0D").gsub("\n", "%0A"); puts "::error title=Docker compose E2E failed::#{msg[0,8000]}"'
            exit "$status"
          fi
          for service in \
            auth-service-stub:http://localhost:8081/actuator/health \
            event-service:http://localhost:8082/actuator/health \
            inscription-service:http://localhost:8083/actuator/health \
            payment-service:http://localhost:8084/actuator/health
          do
            name="${service%%:*}"
            url="${service#*:}"
            echo "Waiting for ${name} at ${url}"
            ready=false
            for attempt in {1..90}; do
              if curl -fsS "${url}" | grep -q UP; then
                ready=true
                break
              fi
              sleep 5
            done
            if [ "${ready}" != "true" ]; then
              docker compose -f docker-compose.e2e.yml ps > docker-compose-ps.log || true
              docker compose -f docker-compose.e2e.yml logs --no-color --tail=160 "${name}" > docker-compose-services.log || true
              ruby -e 'parts = []; parts << "=== docker compose ps ===\n#{File.read("docker-compose-ps.log")}" if File.exist?("docker-compose-ps.log"); parts << "=== service logs ===\n#{File.read("docker-compose-services.log")}" if File.exist?("docker-compose-services.log"); msg = parts.join("\n").gsub("%", "%25").gsub("\r", "%0D").gsub("\n", "%0A"); puts "::error title=Service healthcheck failed::#{msg[0,8000]}"'
              exit 1
            fi
          done

      - name: Verify services
        run: docker compose -f docker-compose.e2e.yml ps

      - name: Seed E2E data
        run: |
          docker compose -f docker-compose.e2e.yml exec -T db-event \
            psql -v ON_ERROR_STOP=1 -U eventos_user -d eventos_event \
            < load-tests/seed/seed-load-test.sql

      - name: Configure npm registry mirror
        working-directory: frontend
        run: echo "registry=https://registry.yarnpkg.com/" > .npmrc

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --registry=https://registry.yarnpkg.com/

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/frontend-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/frontend-vite.log
          exit 1

      - name: Smoke E2E frontend
        working-directory: frontend
        run: npm run smoke:e2e

      - name: Upload compose logs
        if: always()
        run: docker compose -f docker-compose.e2e.yml logs --no-color > docker-compose-e2e.log

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e-tests/target/failsafe-reports/
            docker-compose-up.log
            docker-compose-ps.log
            docker-compose-services.log
            docker-compose-e2e.log
            /tmp/frontend-vite.log
          retention-days: 30

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
