name: CI E2E Smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAVEN_OPTS: -Djdk.attach.allowAttachSelf=true
      JAVA_TOOL_OPTIONS: -Djdk.attach.allowAttachSelf=true -XX:+EnableDynamicAgentLoading
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Package backend services
        run: |
          mvn -U -N -B install
          mvn -U -f shared/pom.xml -B install -DskipTests
          mvn -U -f event-service/pom.xml -B package -DskipTests -Dmaven.test.skip=true
          mvn -U -f inscription-service/pom.xml -B package -DskipTests -Dmaven.test.skip=true
          mvn -U -f payment-service/pom.xml -B package -DskipTests -Dmaven.test.skip=true
          mvn -U -f auth-service-stub/pom.xml -B package -DskipTests -Dmaven.test.skip=true

      - name: Compile E2E test harness
        run: mvn -U -f e2e-tests/pom.xml -B test

      - name: Start docker-compose E2E stack
        run: |
          set +e
          docker compose -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 420 2>&1 | tee docker-compose-up.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            docker compose -f docker-compose.e2e.yml ps > docker-compose-ps.log || true
            docker compose -f docker-compose.e2e.yml logs --no-color --tail=160 > docker-compose-e2e.log || true
            ruby -e 'parts = []; parts << File.read("docker-compose-up.log") if File.exist?("docker-compose-up.log"); parts << File.read("docker-compose-ps.log") if File.exist?("docker-compose-ps.log"); parts << File.read("docker-compose-e2e.log") if File.exist?("docker-compose-e2e.log"); msg = parts.join("\n").lines.last(180).join(" ").gsub(/[%\\r\\n]/, " "); puts "::error title=Docker compose E2E failed::#{msg[0,8000]}"'
            exit "$status"
          fi

      - name: Verify services
        run: docker compose -f docker-compose.e2e.yml ps

      - name: Configure npm registry mirror
        working-directory: frontend
        run: echo "registry=https://registry.yarnpkg.com/" > .npmrc

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --registry=https://registry.yarnpkg.com/

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/frontend-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/frontend-vite.log
          exit 1

      - name: Smoke E2E frontend
        working-directory: frontend
        run: npm run smoke:e2e

      - name: Upload compose logs
        if: always()
        run: docker compose -f docker-compose.e2e.yml logs --no-color > docker-compose-e2e.log

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e-tests/target/failsafe-reports/
            docker-compose-up.log
            docker-compose-ps.log
            docker-compose-e2e.log
            /tmp/frontend-vite.log
          retention-days: 30

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
